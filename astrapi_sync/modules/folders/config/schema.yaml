id_field: id
fields:
  - name: description
    type: text
    label: Bezeichnung
    placeholder: "Dokumente"
    max: 120
    column: 1
    row: 1
    colspan: 2

  - name: group_id
    type: select
    label: Gruppe
    options_endpoint: /api/folder_groups/for-select
    column: 1
    row: 2
    colspan: 2

  - name: enabled
    type: boolean
    label: Aktiviert
    default: true
    column: 1
    row: 3
