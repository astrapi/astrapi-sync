version:      0.0.1
name:         astrapi-sync
display_name: Sync

# sync-circle (mdiSyncCircle) -- Client-Server-Synchronisation, fuer
# Favicon + PWA-Manifest (astrapi-core >= 26.9.3).
icon_svg: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a3a3a3'><path d='M2 12A10 10 0 1 0 12 2A10 10 0 0 0 2 12M15.6 13.72A4 4 0 0 0 16 12A4 4 0 0 0 12 8V10L8.88 7L12 4V6A6 6 0 0 1 18 12A5.9 5.9 0 0 1 17.07 15.19M6 12A5.9 5.9 0 0 1 6.93 8.81L8.4 10.28A4 4 0 0 0 8 12A4 4 0 0 0 12 16V14L15 17L12 20V18A6 6 0 0 1 6 12Z'/></svg>"

# Sync läuft rein ereignisgesteuert (Client-Anfrage/WebSocket-Push),
# nichts zu planen -- Scheduler-Modul wird nicht gebraucht.
disabled_modules:
  - scheduler

# Mandantentrennung (T-Multi-User): jede Person sieht/verwaltet nur ihre
# eigenen Ordner/Geräte. password_fallback bleibt true fuer den
# Bootstrap-/Default-User (Uebergangsloesung bis HTTPS steht, siehe
# system/auth.py); eingeladene Zusatznutzer bekommen nur Passkey-Login
# (multi_user_routes.py). /api/sync muss ausgenommen bleiben -- eigene
# Geraete-Bearer-Token-Auth, kein Web-Login (Android-App/CLI).
auth:
  enabled: true
  multi_user: true
  rp_id: sync.simpsons.lan
  rp_name: astrapi-sync
  password_fallback: true
  exempt_prefixes:
    - /api/sync
