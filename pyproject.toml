[project]
name = "astrapi-sync"
dynamic = ["version"]
description = "astrapi-sync – Ordner-Synchronisation über mehrere Geräte"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "jinja2==3.1.6",
    "APScheduler==3.11.3",
    "pyyaml==6.0.3",
    "python-multipart==0.0.32",
    "cryptography==50.0.0",
    "psutil==7.2.2",
    "apispec==6.10.0",
    "qrcode==8.2",
    "astrapi-core>=26.8.24",
]

[project.scripts]
astrapi-sync = "astrapi_sync._cli:main"

[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["astrapi_sync*"]

[tool.setuptools.package-data]
astrapi_sync = [
    "app.yaml",
    "navigation.yaml",
    "modules/*/templates/**/*.html",
    "modules/*/dialogs/**/*.html",
    "modules/*/schema.yaml",
    "modules/*/modul.yaml",
    "modules/*/settings.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
